<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d3a6b">
<title>Marché de Pasly – Organisation</title>
<style>
:root{--b:#1d3a6b;--b2:#2f5ca8;--bg:#f3f5f9;--c:#fff;--t:#1b2230;--m:#6b7486;--ok:#1f8a4c;--w:#d98a00;--ko:#c0392b;--l:#e2e6ee}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{background:var(--b);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0}
header small{opacity:.8}
main{padding:12px;max-width:1100px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 6px;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--b);font-weight:600}
.card{background:var(--c);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--c);border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kpi b{display:block;font-size:22px}
.kpi small{color:var(--m)}
h2{font-size:16px;margin:4px 0 10px}
h3{font-size:14px;margin:12px 0 6px;color:var(--m);text-transform:uppercase;letter-spacing:.03em}
button,.btn{font:inherit;border:1px solid var(--l);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--t)}
.btn-p{background:var(--b);color:#fff;border-color:var(--b)}
.btn-d{color:var(--ko);border-color:#f0c5c0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--l);border-radius:9px;background:#fff;color:var(--t)}
textarea{min-height:70px}
label.f{display:block;margin-bottom:8px;font-size:13px;color:var(--m)}
label.f>input,label.f>select,label.f>textarea{margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0}
.chk input{width:20px;height:20px}
.item{background:#fff;border-radius:11px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer}
.item .t{font-weight:600}
.item .s{color:var(--m);font-size:13px}
.bd{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:#eef1f6;color:var(--m);margin:3px 3px 0 0}
.bd.ok{background:#dff3e7;color:var(--ok)}.bd.w{background:#fdf0d5;color:#9a6200}.bd.ko{background:#fbe1de;color:var(--ko)}.bd.b{background:#dfe8f8;color:var(--b)}
.muted{color:var(--m);font-size:13px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.plan-wrap{overflow:auto;background:#ddd;border-radius:12px;max-height:70vh;-webkit-overflow-scrolling:touch}
.plan-wrap svg{display:block}
.st rect{stroke:#1b2230;stroke-width:1.5}
.st text{font-size:13px;font-weight:700;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px;fill:#1b2230}
.st.sel rect{stroke:#ff00aa;stroke-width:4}
.edit .st,.edit .poi{cursor:move;touch-action:none}
.poi text{pointer-events:none}
.poi.sel circle{stroke:#ff00aa;stroke-width:4}
.st.dup rect{stroke:#c0392b;stroke-width:4;stroke-dasharray:6 3}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:12px}
.legend i{width:14px;height:10px;display:inline-block;border:1px solid #333}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#1b2230;color:#fff;padding:8px 14px;border-radius:20px;z-index:60;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--l);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button.on{background:var(--b);color:#fff}
.bar{height:8px;border-radius:5px;background:#e5e8ef;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.warn{background:#fff7e3;border:1px solid #f1d58a;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.jj{display:flex;gap:10px;align-items:center}
.jj .n{font-weight:700;min-width:34px;text-align:center;font-size:18px;color:var(--b)}
.jj .x{flex:1;min-width:0}
.tog{min-width:74px;text-align:center}
.tog.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}.tbl th,.tbl td{border:1px solid #cfd5df;padding:5px 6px;text-align:left;vertical-align:top}.tbl th{background:#eef1f6}.tbl-wrap{overflow-x:auto;border-radius:10px}.ponly{display:none}
#bul{position:fixed;inset:0;z-index:70;background:#e9ecf1;overflow:auto;padding:12px}
#bul .bar2{position:sticky;top:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;z-index:2}
.bp{background:#fff;width:210mm;max-width:100%;min-height:290mm;margin:0 auto 14px;padding:12mm 15mm;box-shadow:0 2px 8px rgba(0,0,0,.15);font:9.5pt/1.3 Arial,Helvetica,sans-serif;color:#111}
.bp .hd{display:flex;align-items:center;gap:14px;border-bottom:2px solid #2f5ca8;padding-bottom:8px;margin-bottom:10px}
.bp .hd img{width:62px}.bp .hd div{flex:1;text-align:center}
.bp .t1{font-size:15pt;font-weight:700;color:#1d3a6b}.bp .t2{font-weight:700;color:#2f5ca8;font-size:10pt;margin:2px 0}.bp .t3{font-weight:700;font-size:11pt}
.bp h4{margin:10px 0 4px;padding-left:7px;border-left:4px solid #2f5ca8;color:#1d3a6b;text-transform:uppercase;font-size:10.5pt}
.bp .info{background:#eef3fb;border:1px solid #1d3a6b;padding:7px 10px;margin:8px 0}
.bp .ln{display:flex;align-items:flex-end;margin-top:9px}.bp .ln b{white-space:nowrap;margin-right:4px}.bp .ln i{flex:1;border-bottom:1px dotted #555;height:1em}
.bp .sig{display:flex;gap:16px;margin-top:12px}.bp .sig>div{flex:1}.bp .sigb{border:1px solid #bbb;height:26mm;text-align:center;padding-top:4px}
.bp ul{margin:3px 0;padding-left:20px}.bp li{margin:2px 0}.bp .pay{background:#f4f6fa;border:1px solid #cfd5df;padding:7px 10px;margin:6px 0}
.bp .rgpd{font-size:8.3pt;color:#444}.bp .miss{background:#fff36b}
@media print{body.pbul>*:not(#bul){display:none!important}body.pbul #bul{position:static;background:none;padding:0;overflow:visible}body.pbul #bul .bar2,body.pbul #bul>.warn{display:none!important}body.pbul .bp{box-shadow:none;margin:0;padding:0;width:auto;min-height:0;break-after:page}body.pbul .bp:last-child{break-after:auto}body.pbul .bp .miss{background:none}}body.pbul{background:#fff!important;padding:0!important}}
@media print{.ponly{display:block}.toast{display:none!important}.card{box-shadow:none;padding:0}.tbl{font-size:10.5px}.tbl tr{break-inside:avoid}@page{size:A4;margin:10mm}header,nav,.noprint{display:none!important}body{padding:0}.plan-wrap{max-height:none;overflow:visible}main{padding:0}}
</style>
</head>
<body>
<header><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><h1 id="hTitle">Marché de Pasly</h1><small id="hSub"></small></div><button id="undoB" onclick="undo()" style="display:none;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)">↶ Annuler</button></div></header>
<main id="main"></main>
<nav id="nav">
 <button data-t="dash"><span>📊</span>Suivi</button>
 <button data-t="list"><span>🧾</span>Commerçants</button>
 <button data-t="plan"><span>🗺️</span>Plan</button>
 <button data-t="lists"><span>📋</span>Exposants</button>
 <button data-t="jj"><span>✅</span>Jour J</button>
 <button data-t="param"><span>⚙️</span>Réglages</button>
</nav>
<input type="file" id="fileX" accept=".xlsx" hidden>

  out.push({id:uid(),num:0,zone,type,x:o[0]+ux*along+inward[0]*off,y:o[1]+uy*along+inward[1]*off,a:ang,w:lenM,h:depM});
 }

}
function unitV(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);return[dx/L,dy/L]}
function defaultStands(){
 const c=S.cfg.pxParM, st=[], step=4*c+4;
 const [A,B,C,D]=Z_COURT, vC=unitV(A,B);
 st.push(...rowStands(A,D,vC,7,8,step,4,3,"Basket","stand"));
 st.push(...rowStands(B,C,[-vC[0],-vC[1]],7,8,step,4,3,"Basket","stand"));
 const [P1,P2,P3,P4]=Z_PARK, vP=unitV(P1,P2);
 st.push(...rowStands(P1,P4,vP,11,7,step,4,3,"Parking","stand"));
 st.push(...rowStands(P2,P3,[-vP[0],-vP[1]],7,7,step,4,3,"Parking","stand"));
 const ft=rowStands(P2,P3,[-vP[0],-vP[1]],2,7+7*step,8*c+6,8,3,"Parking","foodtruck");
 st.push(...ft);

}

 if(v.startsWith("356000000"))return [...v].reduce((a,c)=>a+ +c,0)%5===0;

let campQ="",campT="";

function selCand(m){

/* ---------- Plan ---------- */
function standColor(s){
 const occ=occupants(s);
 if(!occ.length)return s.type==="foodtruck"?"#ffe0b3":s.type==="animation"?"#e6dcff":"#ffffff";
 const e=occ[0];
 if(occ.length>1||(Number(e.metrage)>s.w))return "#f4a6a0";
 return e.paye?"#7ccf98":"#ffd76a";
}
function planSVG(){
 const c=S.cfg.pxParM, poly=(p,f,st,dash)=>`<polygon points="${p.map(q=>q.join(",")).join(" ")}" fill="${f}" stroke="${st}" stroke-width="3" ${dash?'stroke-dasharray="12 8"':""}/>`;
 const lab=(x,y,t,a=0)=>`<text x="${x}" y="${y}" transform="rotate(${a} ${x} ${y})" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" stroke="#000" stroke-width="4" paint-order="stroke">${t}</text>`;
 let h=`<svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${IMG_W} ${IMG_H}" style="width:${zoom*100}%">
 <image href="${BG}" x="0" y="0" width="${IMG_W}" height="${IMG_H}"/>
 ${poly(Z_VISIT,"rgba(47,92,168,.18)","#2f5ca8",true)}${lab(860,905,"🅿️ Stationnement visiteurs",-37)}
 ${poly(Z_COURT,"none","#ffffff",true)}${poly(Z_PARK,"none","#ffffff",true)}`;
 const dn=dupNums();
 for(const s of S.stands){
  const w=s.w*c,hh=s.h*c;
  h+=`<g class="st ${selStand===s.id?"sel":""} ${dn.includes(s.num)?"dup":""}" data-id="${s.id}" transform="translate(${s.x} ${s.y})"><rect x="${-w/2}" y="${-hh/2}" width="${w}" height="${hh}" fill="${standColor(s)}" fill-opacity=".92" transform="rotate(${s.a})"/><text text-anchor="middle" dy="5">${s.num}</text></g>`;
 }
 for(const p of S.pois||[])h+=`<g class="poi ${selStand===p.id?"sel":""}" data-id="${p.id}" transform="translate(${p.x} ${p.y})"><circle r="15" fill="#fff" stroke="#1b2230" stroke-width="2"/><text text-anchor="middle" dy="7" font-size="19">${POIS[p.type][0]}</text><title>${esc(p.label||POIS[p.type][1])}</title></g>`;
 return h+`</svg>`;
}
function renderPlan(){
 const free=S.stands.filter(s=>!occupants(s).length).length;
 const nonPl=S.expo.filter(e=>e.statut==="Validé"&&!standOf(e)).length;
 $("#main").innerHTML=`<div class="row noprint" style="margin-bottom:8px;justify-content:space-between">
 <div class="seg"><button class="${planMode==="attrib"?"on":""}" onclick="planMode='attrib';selStand=null;renderPlan()">Attribuer</button><button class="${planMode==="edit"?"on":""}" onclick="planMode='edit';selStand=null;renderPlan()">Modifier le plan</button></div>
 <div class="row"><button onclick="setZoom(-1)">－</button><button onclick="setZoom(1)">＋</button><button onclick="window.print()">🖨️</button></div></div>
 <div class="legend noprint" style="margin-bottom:6px"><span><i style="background:#fff"></i>Libre</span><span><i style="background:#ffe0b3"></i>Food truck libre</span><span><i style="background:#e6dcff"></i>Animation libre</span><span><i style="background:#ffd76a"></i>Attribué, non payé</span><span><i style="background:#7ccf98"></i>Attribué, payé</span><span><i style="background:#f4a6a0"></i>Conflit</span>${Object.entries(POIS).filter(([k])=>(S.pois||[]).some(p=>p.type===k)).map(([k,v])=>`<span>${v[0]} ${v[1]}</span>`).join("")}</div>
 <p class="muted noprint">${S.stands.length} emplacements · ${free} libres · ${nonPl} exposant(s) validé(s) non placé(s). ${planMode==="attrib"?"Touchez un emplacement pour l'attribuer.":"Touchez un emplacement pour le sélectionner, faites-le glisser pour le déplacer."}</p>
 ${dupNums().length?`<div class="warn noprint">⚠️ Numéros en double (encadrés en rouge) : ${dupNums().join(", ")}</div>`:""}
 ${planMode==="edit"?`<div class="row noprint" style="margin-bottom:8px"><label class="f" style="flex:1;min-width:220px;margin:0">Toucher le plan pour ajouter :<select id="addW"><option value="">— rien (sélection / déplacement)</option><option value="stand" ${addWhat==="stand"?"selected":""}>Un emplacement</option>${Object.entries(POIS).map(([k,v])=>`<option value="${k}" ${addWhat===k?"selected":""}>${v[0]} ${v[1]}</option>`).join("")}</select></label><button onclick="renumber()">Renuméroter</button><button class="btn-d" onclick="resetPlan()">Plan par défaut</button></div>`:""}
 <div class="plan-wrap ${planMode==="edit"?"edit":""}" id="pw">${planSVG()}</div>

 const at=$("#addW");if(at)at.onchange=e=>addWhat=e.target.value;
 bindPlan();renderPanel();
}
function setZoom(d){const pw=$("#pw");const r=pw.scrollLeft/pw.scrollWidth,t=pw.scrollTop/pw.scrollHeight;zoom=Math.min(4,Math.max(1,zoom+d*0.5));$("#svg").style.width=zoom*100+"%";pw.scrollLeft=r*pw.scrollWidth;pw.scrollTop=t*pw.scrollHeight}
function svgPt(ev){const svg=$("#svg"),p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
const findObj=id=>S.stands.find(x=>x.id===id)||(S.pois||[]).find(x=>x.id===id);
function bindPlan(){
 const svg=$("#svg");let drag=null,moved=false,downObj=false;
 svg.addEventListener("pointerdown",ev=>{
  const g=ev.target.closest(".st,.poi");downObj=false;if(planMode!=="edit"||!g)return;
  ev.preventDefault();downObj=true;const o=findObj(g.dataset.id);const p=svgPt(ev);
  drag={o,g,dx:o.x-p.x,dy:o.y-p.y};moved=false;svg.setPointerCapture(ev.pointerId);
  if(selStand!==o.id){selStand=o.id;svg.querySelectorAll(".st,.poi").forEach(x=>x.classList.toggle("sel",x===g));renderPanel()}
 });
 svg.addEventListener("pointermove",ev=>{if(!drag)return;const p=svgPt(ev);const nx=Math.round(p.x+drag.dx),ny=Math.round(p.y+drag.dy);if(!moved&&Math.hypot(nx-drag.o.x,ny-drag.o.y)<3)return;drag.o.x=nx;drag.o.y=ny;moved=true;drag.g.setAttribute("transform",`translate(${nx} ${ny})`)});
 const end=()=>{if(drag){if(moved)save();drag=null}};
 svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
 svg.addEventListener("click",ev=>{
  const g=ev.target.closest(".st,.poi");
  if(downObj){downObj=false;return}
  if(planMode==="attrib"){if(g&&g.classList.contains("st"))attribSheet(g.dataset.id);return}
  if(g)return;
  const p=svgPt(ev);
  if(addWhat==="stand"){const ref=S.stands.find(x=>x.id===selStand)||S.stands[S.stands.length-1]||{a:49,w:4,h:3,zone:"Autre",type:"stand"};
   const n={id:uid(),num:Math.max(0,...S.stands.map(x=>x.num))+1,zone:ref.zone,type:ref.type,x:Math.round(p.x),y:Math.round(p.y),a:ref.a,w:ref.w,h:ref.h};
   S.stands.push(n);selStand=n.id;save();refreshSvg();renderPanel()}
  else if(addWhat){S.pois=S.pois||[];const n={id:uid(),type:addWhat,x:Math.round(p.x),y:Math.round(p.y),label:""};S.pois.push(n);selStand=n.id;save();refreshSvg();renderPanel()}
  else{selStand=null;svg.querySelectorAll(".st,.poi").forEach(x=>x.classList.remove("sel"));renderPanel()}
 });
}
function renderPanel(){
 const pp=$("#pp");if(!pp)return;
 if(planMode!=="edit"||!selStand){pp.innerHTML="";return}
 const poi=(S.pois||[]).find(x=>x.id===selStand);
 if(poi){
  pp.innerHTML=`<div class="card"><h2>${POIS[poi.type][0]} ${POIS[poi.type][1]}</h2>
  <div class="two"><label class="f">Type<select id="qT">${Object.entries(POIS).map(([k,v])=>`<option value="${k}" ${k===poi.type?"selected":""}>${v[0]} ${v[1]}</option>`).join("")}</select></label><label class="f">Libellé / note<input id="qL" value="${esc(poi.label)}" placeholder="ex : coffret 32 A"></label></div>
  <button class="btn-d" onclick="delPoi()">Supprimer</button></div>`;
  $("#qT").onchange=()=>{poi.type=$("#qT").value;save();refreshSvg();renderPanel()};
  $("#qL").onchange=()=>{poi.label=$("#qL").value.trim();save();refreshSvg()};
  return;
 }
 const s=S.stands.find(x=>x.id===selStand);if(!s){pp.innerHTML="";return}
 const dupl=S.stands.filter(x=>x.num===s.num).length>1;
 pp.innerHTML=`<div class="card"><h2>Emplacement n° ${s.num}</h2>${dupl?'<div class="bd ko" style="margin-bottom:8px">Ce numéro est utilisé par un autre emplacement</div>':""}
 <div class="two"><label class="f">Numéro<input type="number" id="pNum" value="${s.num}"></label><label class="f">Zone<select id="pZone">${ZONES.map(z=>`<option ${z===s.zone?"selected":""}>${z}</option>`).join("")}</select></label></div>
 <div class="two"><label class="f">Type<select id="pType">${Object.entries(STYPES).map(([k,v])=>`<option value="${k}" ${k===s.type?"selected":""}>${v}</option>`).join("")}</select></label><label class="f">Façade (m)<input type="number" step="0.5" id="pW" value="${s.w}"></label></div>
 <div class="two"><label class="f">Profondeur (m)<input type="number" step="0.5" id="pH" value="${s.h}"></label><label class="f">Angle (°)<input type="number" id="pA" value="${Math.round(s.a)}"></label></div>
 <div class="row"><button onclick="rot(-15)">↺ 15°</button><button onclick="rot(15)">↻ 15°</button><button onclick="rot(90)">↻ 90°</button><button onclick="dup()">Dupliquer</button><button class="btn-d" onclick="delStand()">Supprimer</button></div></div>`;
 const upd=()=>{const n=Number($("#pNum").value);if(n&&n!==s.num&&S.stands.some(x=>x!==s&&x.num===n))toast("⚠️ Le n° "+n+" existe déjà");s.num=n||s.num;s.zone=$("#pZone").value;s.type=$("#pType").value;s.w=Math.max(1,Number($("#pW").value)||s.w);s.h=Math.max(1,Number($("#pH").value)||s.h);s.a=Number($("#pA").value)||0;save();refreshSvg();renderPanel()};
 ["pNum","pZone","pType","pW","pH","pA"].forEach(i=>$("#"+i).onchange=upd);
}
function delPoi(){S.pois=S.pois.filter(x=>x.id!==selStand);selStand=null;save();refreshSvg();renderPanel()}
function refreshSvg(){const pw=$("#pw"),l=pw.scrollLeft,t=pw.scrollTop;pw.innerHTML=planSVG();bindPlan();pw.scrollLeft=l;pw.scrollTop=t}
function rot(d){const s=S.stands.find(x=>x.id===selStand);s.a=((s.a+d)%360+360)%360;save();refreshSvg();renderPanel()}
function dup(){const s=S.stands.find(x=>x.id===selStand);const r=s.a*Math.PI/180,c=S.cfg.pxParM,off=s.w*c+4;
 const n={...s,id:uid(),num:Math.max(...S.stands.map(x=>x.num))+1,x:Math.round(s.x+Math.cos(r)*off),y:Math.round(s.y+Math.sin(r)*off)};S.stands.push(n);selStand=n.id;save();refreshSvg();renderPanel()}
function delStand(){const s=S.stands.find(x=>x.id===selStand);const o=occupants(s);if(o.length&&!confirm("Cet emplacement est attribué à "+nomE(o[0])+". Supprimer quand même ?"))return;
 o.forEach(e=>e.stand=null);S.stands=S.stands.filter(x=>x!==s);selStand=null;save();renderPlan()}
function renumber(){
 const zo={Basket:0,Parking:1,Autre:2};
 S.stands.sort((a,b)=>(zo[a.zone]-zo[b.zone])||(a.num-b.num));S.stands.forEach((s,i)=>s.num=i+1);save();renderPlan();toast("Emplacements renumérotés 1 à "+S.stands.length)}
function resetPlan(){if(!confirm("Remplacer le plan par le plan par défaut ? Les attributions seront perdues."))return;S.expo.forEach(e=>e.stand=null);S.stands=defaultStands();selStand=null;save();renderPlan()}
function attribSheet(sid){
 const s=S.stands.find(x=>x.id===sid),occ=occupants(s);
 const cands=S.expo.filter(e=>actif(e)&&!standOf(e)).sort((a,b)=>(b.statut==="Validé")-(a.statut==="Validé")||(isFT(b)===(s.type==="foodtruck"))-(isFT(a)===(s.type==="foodtruck"))||nomE(a).localeCompare(nomE(b),"fr"));
 const d=sheet(`<div class="sheet-h"><h2>Emplacement n° ${s.num}</h2><button onclick="closeSheet()">✕</button></div>
 <p class="muted">${esc(s.zone)} · ${s.w} × ${s.h} m · ${STYPES[s.type]}</p>
 ${occ.map(e=>`<div class="card"><div class="t"><b>${esc(nomE(e))}</b></div><div class="muted">${esc(e.produits||"")}${e.metrage?" · souhaite "+e.metrage+" m":""}${e.elec?" · ⚡ "+esc(e.materiel||""):""}</div>${Number(e.metrage)>s.w?`<div class="bd ko">Métrage demandé supérieur à l'emplacement</div>`:""}${e.remarques?`<div class="muted">💬 ${esc(e.remarques)}</div>`:""}<div class="row" style="margin-top:8px"><button onclick="assign('${e.id}',null)">Libérer</button><button onclick="closeSheet();editExpo('${e.id}')">Fiche</button></div></div>`).join("")}
 ${occ.length?"":`<input id="aq" placeholder="🔍 Rechercher un exposant à placer"><div id="al" style="margin-top:8px"></div>`}`);
 if(!occ.length){
  const draw=()=>{const q=norm($("#aq").value);$("#al").innerHTML=cands.filter(e=>!q||norm(nomE(e)+e.produits).includes(q)).slice(0,60).map(e=>`<div class="item" onclick="assign('${e.id}','${sid}')"><div class="t">${esc(nomE(e))}</div><div class="s">${esc(e.type)}${e.produits?" · "+esc(e.produits):""}</div><div><span class="bd ${e.statut==="Validé"?"ok":"w"}">${esc(e.statut)}</span>${e.metrage?`<span class="bd ${Number(e.metrage)>s.w?"ko":""}">${e.metrage} m</span>`:""}${e.elec?'<span class="bd">⚡</span>':""}${e.remarques?`<div class="s">💬 ${esc(e.remarques)}</div>`:""}</div></div>`).join("")||'<p class="muted">Aucun exposant à placer.</p>'};
  $("#aq").oninput=draw;draw();
 }
}
function assign(eid,sid){const e=S.expo.find(x=>x.id===eid);e.stand=sid;if(sid)e.confirmation=false;save();closeSheet();const pw=$("#pw"),l=pw?pw.scrollLeft:0,t=pw?pw.scrollTop:0,y=window.scrollY;renderPlan();$("#pw").scrollLeft=l;$("#pw").scrollTop=t;window.scrollTo(0,y);toast(sid?"Attribué":"Libéré")}

/* ---------- Listings ---------- */
let listsMode="part",annT="",annQ="";
const fmtD=d=>d?new Date(d+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}):"";
const histTxt=e=>{const h=(e.historique||[]).map(x=>x.date?new Date(x.date+"T12:00").toLocaleDateString("fr-FR",{month:"short",year:"numeric"}):"?");mk().forEach(m=>{if(mget(e,m.id).statut==="Validé")h.push((m.date?fdC(m.date):"?")+" (retenu)")});return h.join(", ")};
function annuaireRows(){
 const q=norm(annQ);
 return S.expo.filter(e=>(!annT||e.type===annT)&&(!q||norm([e.nom,e.prenom,e.entreprise,e.produits,e.adresse].join(" ")).includes(q)))
  .sort((a,b)=>(a.type||"").localeCompare(b.type||"","fr")||(a.nom||a.entreprise).localeCompare(b.nom||b.entreprise,"fr"));
}
const partRows=()=>S.expo.filter(e=>e.statut==="Validé").sort((a,b)=>(standOf(a)?.num??9999)-(standOf(b)?.num??9999)||nomE(a).localeCompare(nomE(b),"fr"));
function renderLists(){
 const c=S.cfg;
 let body="";
 if(listsMode==="ann"){
  const L=annuaireRows(),types=[...new Set(S.expo.map(e=>e.type).filter(Boolean))].sort();
  body=`<div class="two noprint" style="margin-bottom:8px"><input id="anq" placeholder="🔍 Rechercher" value="${esc(annQ)}"><select id="ant"><option value="">Tous les types</option>${types.map(t=>`<option ${t===annT?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
  <div class="card"><div class="ponly"><h2>Annuaire des commerçants – ${esc(c.titre)}</h2><p class="muted">Édité le ${new Date().toLocaleDateString("fr-FR")} · ${L.length} commerçant(s)</p></div>
  <p class="muted noprint">${L.length} commerçant(s) – tous les inscrits, toutes éditions confondues, quel que soit leur statut.</p>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Type</th><th>Commerçant</th><th>Produits</th><th>Téléphone</th><th>E-mail</th><th>Adresse</th><th>SIRET</th><th>Participations</th><th>Statut actuel</th></tr></thead><tbody>
  ${L.map(e=>`<tr onclick="editExpo('${e.id}')"><td>${esc(e.type)}</td><td><b>${esc(e.entreprise||"")}</b>${e.entreprise?"<br>":""}${esc([e.prenom,e.nom].filter(Boolean).join(" "))}</td><td>${esc(e.produits)}</td><td style="white-space:nowrap">${esc(e.tel)}</td><td>${esc(e.email)}</td><td>${esc(e.adresse)}</td><td>${esc(e.siret)}</td><td>${esc(histTxt(e))}</td><td>${esc(e.statut)}</td></tr>`).join("")}
  </tbody></table></div></div>`;
 }else{
  const L=partRows(),nb=L.length;
  body=`${c.date?"":`<div class="warn noprint">La date du marché n'est pas renseignée (Réglages → Événement).</div>`}
  <div class="card"><h2>Participants – ${esc(c.titre)}${c.date?" du "+fmtD(c.date):""}</h2><p class="muted">${esc(c.horaires)} · ${esc(c.lieu)}<br>${nb} exposant(s) validé(s) · ${L.filter(e=>e.elec).length} avec électricité · édité le ${new Date().toLocaleDateString("fr-FR")}</p>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>N°</th><th>Zone</th><th>Exposant</th><th>Produits</th><th>Téléphone</th><th>⚡</th><th>Montant</th><th>Payé</th><th>Arrivée / signature</th></tr></thead><tbody>
  ${L.map(e=>{const s=standOf(e);return `<tr onclick="editExpo('${e.id}')"><td><b>${s?s.num:"–"}</b></td><td>${s?esc(s.zone):"non placé"}</td><td><b>${esc(e.entreprise||"")}</b>${e.entreprise?"<br>":""}${esc([e.prenom,e.nom].filter(Boolean).join(" "))}</td><td>${esc(e.produits)}</td><td style="white-space:nowrap">${esc(e.tel)}</td><td>${e.elec?"Oui":""}</td><td>${montant(e)} €</td><td>${e.paye?"✓ "+esc(e.paiementMode):""}</td><td style="min-width:110px">${e.present?"✓":""}</td></tr>`}).join("")}
  </tbody></table></div></div>`;
 }
 $("#main").innerHTML=`<div class="row noprint" style="margin-bottom:8px;justify-content:space-between"><div class="seg"><button class="${listsMode==="part"?"on":""}" onclick="listsMode='part';renderLists()">Participants</button><button class="${listsMode==="ann"?"on":""}" onclick="listsMode='ann';renderLists()">Annuaire</button></div><div class="row"><button onclick="window.print()">🖨️ Imprimer</button><button onclick="exportList()">📤 Excel</button></div></div>${body}`;
 const q=$("#anq");if(q){q.oninput=ev=>{annQ=ev.target.value;const p=ev.target.selectionStart;renderLists();const i=$("#anq");i.focus();i.setSelectionRange(p,p)};$("#ant").onchange=ev=>{annT=ev.target.value;renderLists()}}
}
function exportList(){
 const c=S.cfg,on=b=>b?"Oui":"";
 if(listsMode==="ann"){
  const R=[["Type","Entreprise","Nom","Prénom","Produits","Téléphone","E-mail","Adresse","SIRET","Participations","Statut actuel"],...annuaireRows().map(e=>[e.type,e.entreprise,e.nom,e.prenom,e.produits,e.tel,e.email,e.adresse,e.siret,histTxt(e),e.statut])];

  makeXlsx(`participants-marche-pasly-${c.date||today()}.xlsx`,[["Participants",R]]);
 }
}

function renderJJ(){
 const V=S.expo.filter(e=>e.statut==="Validé");
 const q=norm(jjQ);
 const L=V.filter(e=>!q||norm(nomE(e)+(standOf(e)?.num??"")).includes(q)).sort((a,b)=>(standOf(a)?.num??9999)-(standOf(b)?.num??9999));
 const pres=V.filter(e=>e.present).length,enc=V.filter(e=>e.paye).reduce((a,e)=>a+montant(e),0),sp=V.filter(e=>e.paye&&(e.paiementMode==="Sur place"||e.paiementMode==="Espèces")).reduce((a,e)=>a+montant(e),0);
 $("#main").innerHTML=`<div class="grid" style="margin-bottom:10px"><div class="kpi"><small>Arrivés</small><b>${pres}/${V.length}</b><div class="bar"><i style="width:${V.length?pres*100/V.length:0}%"></i></div></div><div class="kpi"><small>Encaissé total</small><b>${enc} €</b><small>dont ${sp} € sur place / espèces</small></div></div>
 <input id="jq" placeholder="🔍 Nom ou n° d'emplacement" value="${esc(jjQ)}" style="margin-bottom:8px">
 ${L.map(e=>{const s=standOf(e);return `<div class="item"><div class="jj"><div class="n">${s?s.num:"–"}</div><div class="x" onclick="editExpo('${e.id}')"><div class="t">${esc(nomE(e))}</div><div class="s">${esc(e.produits||"")}${e.elec?" · ⚡":""}</div>${e.paye?"":`<span class="bd ko">${montant(e)} € à encaisser</span>`}</div>
 <div style="display:flex;flex-direction:column;gap:6px"><button class="tog ${e.present?"on":""}" onclick="tg('${e.id}','present')">${e.present?"Arrivé ✓":"Arrivé ?"}</button><button class="tog ${e.paye?"on":""}" onclick="payJ('${e.id}')">${e.paye?"Payé ✓":"Payer"}</button></div></div></div>`}).join("")||'<p class="muted">Aucun exposant validé.</p>'}`;
 $("#jq").oninput=ev=>{jjQ=ev.target.value;const p=ev.target.selectionStart;renderJJ();const i=$("#jq");i.focus();i.setSelectionRange(p,p)};
}
function tg(id,k){const e=S.expo.find(x=>x.id===id);e[k]=!e[k];save();renderJJ()}
function payJ(id){
 const e=S.expo.find(x=>x.id===id);
 if(e.paye){if(confirm("Annuler le paiement de "+nomE(e)+" ?")){e.paye=false;save();renderJJ()}return}
 sheet(`<div class="sheet-h"><h2>Encaisser ${montant(e)} €</h2><button onclick="closeSheet()">✕</button></div><p>${esc(nomE(e))}</p><div class="row">${["Espèces","Chèque","Virement"].map(m=>`<button class="btn-p" onclick="doPay('${id}','${m}')">${m}</button>`).join("")}</div>`);
}
function doPay(id,m){const e=S.expo.find(x=>x.id===id);e.paye=true;e.paiementMode=m;save();closeSheet();renderJJ();toast("Paiement enregistré")}

  ["xl/styles.xml",`${X}<styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
  ...sheets.map(([,rows],i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(rows)])];
 download(fname,zip(files));
}
function exportXlsx(){
 const on=b=>b?"Oui":"Non";
 const H=["Nom","Prénom","Entreprise","Type d'activité","Produits vendus","Téléphone","Email","Adresse","SIRET","Électricité","Matériel électrique","Métrage","Food truck","Remarques","Bulletin","Kbis","RC Pro","Paiement","Payé","Montant dû (€)","Statut","N° emplacement","Zone","Confirmation envoyée","Présent","Notes"];
 const others=mk().filter(m=>m.id!==S.cfg.actif);H.push(...others.map(m=>"Statut "+fdC(m.date)));
 const R=[H,...[...S.expo].sort((a,b)=>(a.nom||a.entreprise).localeCompare(b.nom||b.entreprise,"fr")).map(e=>{const s=standOf(e);return[e.nom,e.prenom,e.entreprise,e.type,e.produits,e.tel,e.email,e.adresse,e.siret,e.elec==null?"":on(e.elec),e.materiel,e.metrage===""?"":Number(e.metrage)||e.metrage,on(isFT(e)),e.remarques,on(e.bulletin),on(e.kbis),on(e.rc),e.paiementMode,on(e.paye),montant(e),e.statut,s?s.num:"",s?s.zone:"",on(e.confirmation),on(e.present),e.notes,...others.map(m=>mget(e,m.id).statut)]})];
 const P=[["N°","Zone","Type","Façade (m)","Exposant","Produits","Électricité","Payé"],...[...S.stands].sort((a,b)=>a.num-b.num).map(s=>{const e=occupants(s)[0];return[s.num,s.zone,STYPES[s.type],s.w,e?nomE(e):"libre",e?e.produits:"",e?(e.elec?"Oui":"Non"):"",e?on(e.paye):""]})];
 makeXlsx(`marche-pasly-${S.cfg.date||today()}.xlsx`,[["Exposants",R],["Emplacements",P]]);
}

/* ---------- démarrage ---------- */
function init(){
 S=load();
 if(!S){S={cfg:{...DEF_CFG},expo:[],stands:[],lastBackup:null};S.stands=defaultStands();save()}
 S.cfg={...DEF_CFG,...S.cfg};S.pois=S.pois||[];
 if(!S.cfg.marches||!S.cfg.marches.length){S.cfg.marches=S.cfg.date&&!["2027-06-04","2027-09-10"].includes(S.cfg.date)?[{id:uid(),date:S.cfg.date}]:[{id:uid(),date:"2027-06-04"},{id:uid(),date:"2027-09-10"}];
  const a=S.cfg.marches.find(m=>m.date===S.cfg.date)||S.cfg.marches[0];S.cfg.actif=a.id;S.cfg.date=a.date;S.expo.forEach(e=>{e.m={}});syncOut();localStorage.setItem(KEY,JSON.stringify(S))}
 if(S.cfg.candCorps)S.cfg.candCorps=S.cfg.candCorps.replace("organise son marché nocturne {quand}","organise {ses_marches} {quand}");
 if(!mk().some(m=>m.id===S.cfg.actif))S.cfg.actif=mk()[0].id;
 syncIn();lastSaved=JSON.stringify(S);undoStack=[];updUndo();
}
init();render();
